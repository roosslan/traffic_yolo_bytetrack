# Скопируйте этот файл в config.toml и отредактируйте. config.toml содержит адрес камеры
# (возможно, с паролем), поэтому его не следует добавлять в git.
#
# Все координаты на кадре ([[lines]], [roi]) задаются в долях кадра: x = 0 - левый край,
# x = 1 - правый, y = 0 - верх, y = 1 - низ. Так настройки не зависят от разрешения потока.

[camera]
name = "cam1"                 # имя камеры, попадает во все таблицы ClickHouse
rtsp_url = "rtsp://user:password@192.168.1.10:554/stream"
transport = "tcp"             # "tcp" надёжнее, "udp" даёт чуть меньшую задержку
reconnect_delay_sec = 3.0     # пауза перед переподключением после потери потока
timeout_sec = 5.0             # таймаут открытия и чтения; зависший поток вызовет переподключение

[roi]
# Зона интереса: цели с центром вне неё не учитываются (парковка, тротуар, двор).
# Вершины многоугольника [[x, y], ...]; пустой список - весь кадр.
polygon = []
# Прямоугольники [x1, y1, x2, y2], которые не учитываются никогда: часы и надписи камеры.
ignore = [[0.0, 0.0, 0.4, 0.07]]

[daynight]
mode = "auto"                 # "auto" - по картинке, "day" - всегда YOLO, "night" - всегда фары
check_interval_sec = 5.0      # как часто оценивать картинку в режиме auto
switch_after_sec = 30.0       # новый режим включается, если держится столько секунд подряд
color_threshold = 4.0         # кадр серее этого (ИК-режим камеры) - ночь
dark_threshold = 40.0         # кадр темнее этого (0..255) - ночь

[model]
# Дневной детектор: YOLO + ByteTrack.
weights = "models/yolov8s.pt" # если файла нет, ultralytics скачает его сам (~22 МБ); yolov8n.pt быстрее, но слабее
device = "cpu"                # "cpu", "cuda" или "cuda:0" (нужен PyTorch с CUDA, см. README)
imgsz = 1280                  # до этого размера сжимается кадр; больше = видны дальние цели, но медленнее
conf = 0.1                    # порог детектора; низкий нужен, чтобы ByteTrack вёл машины сквозь засветку (новые треки он всё равно начинает только от 0.25)
iou = 0.5                     # порог подавления дублей (NMS)
classes = ["car", "motorcycle", "bus", "truck"]  # что считаем; [] = все 80 классов COCO
half = false                  # FP16: быстрее на GPU, на CPU не работает
tracker = "bytetrack.yaml"    # "bytetrack.yaml", "botsort.yaml" или путь к своему файлу

[headlights]
# Ночной детектор: машины по свету фар. Размеры - в пикселях рабочего кадра (work_width).
work_width = 720              # кадр шире этого уменьшается до этой ширины перед разбором
min_brightness = 180          # пиксель фары ярче этого (0..255)
min_diff = 50                 # и ярче фона хотя бы на столько
min_area = 3                  # пятна меньше стольких пикселей - шум
max_area = 3000               # цели больше стольких пикселей (по рамке) - засветка, а не фары
pair_distance = 25.0          # пятна ближе стольких px - одна цель (две фары одной машины)
background_alpha = 0.05       # скорость обновления фона (0..1)
max_match_distance = 60.0     # дальше этого (px) от ожидаемого места пятно - уже другая цель
max_missed_frames = 10        # цель забывается, если не видна столько кадров подряд
# Фары и габариты одной машины - два пятна друг за другом. Проезд второго не считается,
# если рядом (ближе стольких px) едет только что засчитанная цель. 0 - не склеивать.
merge_distance = 100.0

[tracking]
confirm_hits = 3              # цель захвачена, когда подтверждена на стольких кадрах подряд
lost_timeout_sec = 3.0        # цель потеряна, если её не видно дольше этого времени
points_interval_sec = 0.5     # как часто писать точку траектории (0 = на каждом кадре)
trail_length = 40             # длина «хвоста» траектории в окне
reset_gap_sec = 5.0           # разрыв между кадрами больше этого сбрасывает трекер
stats_interval_sec = 60.0     # как часто писать статистику в журнал (0 = не писать)

[snapshots]
enabled = true                # снимок в момент проезда
directory = "capture"
annotate = true               # рисовать рамки, номера и линию подсчёта на снимке

[clickhouse]
enabled = true                # false: проезды только в журнал, без базы
host = "127.0.0.1"            # или IP машины с ClickHouse, например "192.168.1.20"
port = 8124                   # HTTP-порт ClickHouse (8124, чтобы не мешать другому ClickHouse на 8123)
username = "traffic"
password = ""                 # лучше не хранить здесь: задайте переменную TRAFFIC_CLICKHOUSE_PASSWORD
database = "traffic"
secure = false                # true: подключаться по HTTPS
create_schema = true          # при старте создать базу и таблицы, если их нет
batch_size = 500              # писать, когда накопилось столько строк...
flush_interval_sec = 2.0      # ...или когда прошло столько секунд
max_buffer_rows = 100000      # если база недоступна, копим не больше стольких строк
connect_timeout_sec = 5.0

# Линии подсчёта: машина засчитывается, когда центр её рамки проходит через отрезок линии.
# Линий может быть сколько угодно, каждая - отдельная таблица [[lines]]:
#   name       - имя линии, попадает в таблицу crossings;
#   points     - две точки [x, y];
#   directions - названия направлений. [0] - переход справа налево, если встать в первую
#                точку лицом ко второй. Для вертикальной линии, заданной сверху вниз, [0] -
#                движение слева направо; для горизонтальной слева направо - снизу вверх.
# Ставьте линии поперёк дороги, подальше от краёв кадра и от бликов. Без линий проезды не
# считаются. Координаты зависят от потока камеры: у основного потока (2560x1440) и у
# дополнительного (/1, 720x480) кадр выстроен по-разному.
#
# Линии ниже - пример для одной камеры, основной поток. Основная дорога идёт из левого
# нижнего угла вправо вверх; к ней примыкают две дороги: side_a сверху слева (устье около
# x = 0.25..0.45) и side_b снизу (устье около x = 0.63..0.70, сама дорога
# в кадр не попадает). Линии основной дороги стоят на трёх её участках: левее side_a, между
# примыканиями и правее side_b.

[[lines]]
name = "main_west"            # основная дорога левее side_a
points = [[0.12, 0.85], [0.12, 0.995]]
directions = ["to_right", "to_left"]

[[lines]]
name = "main_mid"             # основная дорога между side_a и side_b
points = [[0.50, 0.72], [0.50, 0.95]]
directions = ["to_right", "to_left"]

[[lines]]
name = "main_east"            # основная дорога правее side_b
points = [[0.76, 0.57], [0.76, 0.76]]
directions = ["to_right", "to_left"]

[[lines]]
name = "side_a"               # поперёк примыкающей дороги сверху слева
points = [[0.24, 0.70], [0.42, 0.70]]
directions = ["in", "out"]    # in - съезд с основной на примыкающую, out - выезд на основную

[[lines]]
name = "side_b"               # вдоль устья примыкающей дороги снизу
points = [[0.6325, 0.804], [0.705, 0.733]]
directions = ["out", "in"]    # out - выезд на основную, in - съезд с основной
